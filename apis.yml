aid: skylo
name: Skylo
description: 'Skylo Technologies is a satellite communications company based in Mountain
  View, California, operating a global Non-Terrestrial Network (NTN) that lets standard
  smartphones and IoT cellular devices connect directly to satellites over 3GPP Release
  17 direct-to-device (D2D) standards for SMS, sensor telemetry, and other low-bandwidth
  messaging. Founded in 2017 and backed by DCM, SoftBank, Intel Capital, Innovation
  Endeavors, BMW i Ventures, Samsung Catalyst, Next47, Seraphim Space, and NGP Capital,
  Skylo has commercial service across the US, Brazil, Australia, New Zealand, and Europe.
  Skylo does not publish a public REST/HTTP API; developer integration is device-level
  (certified modules such as Quectel, Murata, Blues Notecard and Particle) with detailed
  procedures gated behind a partner Knowledge Base. This API Evangelist profile tracks
  the company and its developer surface.'
